# Release settings for scripts/release.sh. No secrets here: this file is in git.
# Anything personal (the GitLab token, where the web app is deployed) goes in
#   ~/.config/mnemostxt/release.env
# which is read after this file and may override any line below.

GITLAB_URL=https://gitlab.com
GITLAB_PROJECT=niharokz/mnemostxt     # group/name on GitLab
MAIN_BRANCH=main
PUSH_REMOTES=origin                    # space-separated; GitLab mirrors to GitHub and Codeberg itself
PIPELINE_TIMEOUT_MIN=90                # give up waiting for a pipeline after this long
POLL_SECONDS=20                        # how often to ask GitLab about a pipeline
PERMALINKS="mnemostxt.apk mnemostxt-setup.exe mnemostxt.deb"   # must answer after a release

# The web app (optional). Set these in release.env, never here:
#   DEPLOY_DIR=/path/to/your/mnemostxt/checkout   docker compose runs there
#   HEALTH_URL=https://notes.example.com           checked after deploying (/health and the version on /)
DEPLOY_DIR=
HEALTH_URL=
WEB_SERVICE=mnemostxt                  # the service name in docker-compose.yml
